name: Package & Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（例如 v2.6.4-system）"
        required: true
        default: "v2.6.4-system"
        type: string
      publish_release:
        description: "是否同步创建/更新 GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-win-x64:
    name: Build & Package Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 校验标签格式
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:INPUT_TAG.Trim()
          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }
          $normalized = $tag.Substring(1)
          if ($normalized -notmatch '^\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?$') {
            Write-Error "标签格式错误: $tag（示例：v2.6.4-system）"
            exit 1
          }
          $baseVersion = ($normalized -split '-')[0]
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 编译 MSVC x64 并运行测试
        shell: pwsh
        run: .\build.ps1 -Clean -Config Release -Arch x64 -RunTests

      - name: 组装系统代理纯净安装包
        id: pkg
        shell: pwsh
        env:
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "pkg-stage"
          $outZip = Join-Path $env:RUNNER_TEMP "antigravity-proxy-system-v$($env:BASE_VERSION)-win-x64.zip"
          $shaFile = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"

          New-Item -ItemType Directory -Path (Join-Path $stage "dist\ide") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "dist\cli") -Force | Out-Null

          Copy-Item "output\ide\version.dll" (Join-Path $stage "dist\ide\version.dll") -Force
          Copy-Item "output\cli\dbghelp.dll" (Join-Path $stage "dist\cli\dbghelp.dll") -Force

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $cfg = @{
            _version = "$($env:BASE_VERSION)-system"
            log_level = "info"
            proxy = @{
              mode = "system"
              host = "127.0.0.1"
              port = 7890
              type = "socks5"
              username = ""
              password = ""
            }
            fake_ip = @{
              enabled = $true
              cidr = "198.18.0.0/15"
            }
            timeout = @{
              connect = 5000
              send = 5000
              recv = 5000
            }
            child_injection = $true
            child_injection_mode = "filtered"
            target_processes = @("agy.exe", "language_server.exe", "language_server_windows", "Antigravity.exe", "Antigravity IDE.exe", "node.exe")
            proxy_rules = @{
              allowed_ports = @(80, 443, 3478)
              dns_mode = "direct"
              ipv6_mode = "proxy"
              udp_mode = "auto"
              udp_fallback = "block"
            }
            ui = @{
              load_notify = "none"
            }
            updates = @{
              enabled = $false
            }
          } | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $stage "dist\ide\config.json"), $cfg, $utf8NoBom)
          [IO.File]::WriteAllText((Join-Path $stage "dist\cli\config.json"), $cfg, $utf8NoBom)

          foreach ($f in @("deploy.ps1", "README_SYSTEM_PROXY.md", "LICENSE.txt", "AUTHORS.txt")) {
            Copy-Item $f (Join-Path $stage $f) -Force
          }
          Copy-Item "一键部署或修复系统代理补丁.bat" (Join-Path $stage "一键部署或修复系统代理补丁.bat") -Force

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $outZip -Force
          $hash = (Get-FileHash -Path $outZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $outZip)" | Out-File -FilePath $shaFile -Encoding ascii

          "zip_path=$outZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_path=$shaFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: antigravity-proxy-system-win-x64
          path: |
            ${{ steps.pkg.outputs.zip_path }}
            ${{ steps.pkg.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 7

      - name: 发布 GitHub Release（可选）
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          files: |
            ${{ steps.pkg.outputs.zip_path }}
            ${{ steps.pkg.outputs.sha_path }}
          fail_on_unmatched_files: true
